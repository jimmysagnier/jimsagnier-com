name: Publish Check

# Déclenché À LA DEMANDE (par le Cloudflare Cron Worker "publish-heartbeat",
# ou manuellement via l'onglet Actions).
#
# ⚠️ PAS de trigger `schedule` ici, et c'est VOLONTAIRE. GitHub désactive
# automatiquement tout workflow qui a un trigger `schedule` après 60 jours
# d'inactivité du dépôt, et ne le réactive PAS sur un simple push. C'est très
# exactement ce qui a fait rater la publication de l'article du 1er sept. 2026
# (l'ancien scheduled-publish.yml était en état `disabled_inactivity`).
# Le rythme vient désormais d'un Cloudflare Cron Trigger, qui ne se désactive
# jamais pour inactivité. Un workflow `workflow_dispatch` (comme celui-ci) ou
# `push` n'est jamais auto-désactivé.
on:
  workflow_dispatch:

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check for scheduled articles
        id: check
        run: node scripts/check-scheduled.mjs

      - name: Build production
        if: steps.check.outputs.has_scheduled == 'true'
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare Pages
        if: steps.check.outputs.has_scheduled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=jimsagnier-com --branch=main
